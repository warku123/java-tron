name: Integration Test Multinode Smoke

# Manual-only. Triggers the integration test image with --multinode --smoke
# against a 3-witness docker-compose stack. Uses the FullNode.jar built from
# this PR's source (not the published tronprotocol/java-tron image).
#
# Status: skeleton. Requires DinD path-alignment fix in the integration-test
# repo (docker/multi-node/start-multinode.sh -p flag, run-tests.sh HOST_WORKDIR
# handling, etc.) before it can pass.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multinode-smoke:
    name: Integration Test Multinode Smoke (JDK 8 / x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout java-tron
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-integration-test-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-integration-test-

      - name: Build FullNode.jar
        run: ./gradlew clean build -x test --no-daemon

      - name: Build local java-tron Docker image (wraps PR-built FullNode.jar)
        run: |
          # Minimal wrapper image: take the published base image and swap in
          # the PR's freshly-built FullNode.jar.
          mkdir -p /tmp/tron-image
          cp build/libs/FullNode.jar /tmp/tron-image/
          cat > /tmp/tron-image/Dockerfile <<'EOF'
          FROM tronprotocol/java-tron:latest
          COPY FullNode.jar /java-tron/lib/FullNode.jar
          EOF
          docker build -t java-tron-local:pr -f /tmp/tron-image/Dockerfile /tmp/tron-image

      - name: Pull integration-test image
        run: docker pull warku123/java-tron-integration-test:latest

      - name: Run multinode smoke tests
        run: |
          # DinD: mount host docker socket so the container's docker-compose
          # talks to the host daemon. Path alignment: bind-mount workspace at
          # the SAME path inside the container so docker-compose volume paths
          # resolve identically on host and in-container.
          docker run --name integration-multinode-smoke \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:${{ github.workspace }}" \
            --workdir "${{ github.workspace }}" \
            -e TRON_IMAGE=java-tron-local:pr \
            -e HOST_WORKDIR="${{ github.workspace }}" \
            -e JAVA_HOME=/usr/lib/jvm/temurin-8 \
            -e JAVA_HOME_17=/opt/java/openjdk \
            warku123/java-tron-integration-test:latest \
            --multinode --smoke --clean

      - name: Extract test reports from container
        if: always()
        run: |
          mkdir -p integration-reports
          docker cp integration-multinode-smoke:/app/build/reports/. integration-reports/reports/ 2>/dev/null || true
          docker cp integration-multinode-smoke:/app/build/test-results/. integration-reports/test-results/ 2>/dev/null || true
          docker cp integration-multinode-smoke:/app/build/test-output.log integration-reports/ 2>/dev/null || true
          docker cp integration-multinode-smoke:/app/docker/multi-node/. integration-reports/multinode-logs/ 2>/dev/null || true
          docker rm -f integration-multinode-smoke 2>/dev/null || true
          # Capture compose-level logs while containers are still around.
          docker ps -a --format '{{.Names}}' | grep -E 'node1|node2|node3' | while read c; do
            docker logs "$c" > "integration-reports/${c}.log" 2>&1 || true
          done

      - name: Stop multinode stack
        if: always()
        run: |
          # Compose stack started inside the container; tear it down from host
          # via the same project name (-p multinode) used by the run.
          docker compose -p multinode -f /tmp/null down -v 2>/dev/null || true
          docker ps -a --format '{{.Names}}' | grep -E '^multinode_' | xargs -r docker rm -f || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: integration-multinode-smoke-report
          path: integration-reports/
          if-no-files-found: warn
